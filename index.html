<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Budget Planner</title>
    <meta name="description" content="Track monthly income and expenses, including recurring entries." />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#3f5ef1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Finance tracker</p>
          <h1>Monthly Budget Planner</h1>
        </div>
        <div class="header-controls">
          <label class="header-picker">
            <span>Theme</span>
            <select id="themeMode">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="auto">Auto (system)</option>
            </select>
          </label>
          <label class="header-picker">
            <span>Currency</span>
            <select id="currency">
              <option value="USD">USD ($)</option>
              <option value="JMD">JMD (J$)</option>
              <option value="CAD">CAD (CA$)</option>
              <option value="GBP">GBP (£)</option>
              <option value="EUR">EUR (€)</option>
            </select>
          </label>
          <label class="header-picker">
            <span>Month</span>
            <input id="monthFilter" type="month" />
          </label>
        </div>
      </header>

      <main class="grid">
        <aside class="panel summary-panel">
          <h2>Overview</h2>
          <div class="summary-cards">
            <div class="summary-card income">
              <span class="summary-label">Income</span>
              <strong id="incomeTotal" class="summary-amount">$0.00</strong>
            </div>
            <div class="summary-card expense">
              <span class="summary-label">Expenses</span>
              <strong id="expenseTotal" class="summary-amount">$0.00</strong>
            </div>
            <div class="summary-card net">
              <span class="summary-label">Net</span>
              <strong id="netTotal" class="summary-amount">$0.00</strong>
            </div>
          </div>
        </aside>

        <section class="panel form-panel">
          <h2>Add income or expense</h2>
          <form id="entryForm">
            <div class="field-row two-up">
              <label>
                <span>Title</span>
                <input id="title" name="title" type="text" placeholder="Rent, Salary, Groceries" maxlength="80" required />
              </label>
              <label>
                <span>Amount</span>
                <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required />
              </label>
            </div>

            <div class="field-row two-up">
              <label>
                <span>Type</span>
                <select id="type" name="type">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </label>
              <label>
                <span>Category</span>
                <select id="category" name="category"></select>
              </label>
            </div>

            <div class="field-row two-up">
              <label>
                <span>Entry type</span>
                <select id="occurrence" name="occurrence">
                  <option value="one-off">One-off</option>
                  <option value="recurring">Recurring</option>
                </select>
              </label>
              <label id="frequencyField">
                <span>Frequency</span>
                <select id="frequency" name="frequency">
                  <option value="monthly">Monthly</option>
                  <option value="weekly">Weekly</option>
                  <option value="yearly">Yearly</option>
                </select>
              </label>
            </div>

            <label>
              <span id="dateLabelText">Date</span>
              <input id="date" name="date" type="date" required />
            </label>

            <label>
              <span>Notes</span>
              <textarea id="notes" name="notes" rows="3" placeholder="Optional notes"></textarea>
            </label>

            <div class="form-actions">
              <button id="submitBtn" type="submit" class="primary-btn">Add entry</button>
              <button id="cancelEditBtn" type="button" class="secondary-btn hidden">Cancel edit</button>
            </div>
          </form>
        </section>
      </main>

      <section class="panel list-panel">
        <div class="list-header">
          <h2>Entries</h2>
          <button id="clearAllBtn" class="ghost-btn" type="button">Clear all</button>
        </div>
        <div id="entriesList" class="entries-list" aria-live="polite"></div>
      </section>
    </div>

    <script src="script.js"></script>
    <script>
      // Service workers only run over http(s), not when index.html is opened as a file.
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker failed:', err));
        });
      }
    </script>
  </body>
</html>
